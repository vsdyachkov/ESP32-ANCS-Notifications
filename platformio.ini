; PlatformIO demo for running this library directly on SQFMI Watchy.
; The library itself remains in src/, while this env builds examples/watchy_ancs.

[platformio]
src_dir = examples/watchy_ancs

[env:watchy]
platform = espressif32@5.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 768000
board_build.partitions = huge_app.csv
lib_ldf_mode = deep+
lib_extra_dirs = .
lib_ignore = .pio

lib_deps =
    adafruit/Adafruit BusIO@^1.17.4
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    paulstoffregen/Time@^1.6.1
    https://github.com/sqfmi/Watchy.git
    https://github.com/elpaso/Rtc_Pcf8563.git
    https://github.com/tzapu/WiFiManager.git

build_flags =
    -DARDUINO_ARCH_ESP32
    -DWATCHY_SIMULATE_WATCHY_BOARD
    -DENABLE_IOS_SETTINGS_PAIRING_HELPER
    -DBLE_USE_STATIC_RANDOM_ADDRESS
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ESP32_PHY_MAX_TX_POWER=CONFIG_ESP_PHY_MAX_TX_POWER
